name: ci

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::6}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-app:${{ env.SHORT_SHA }}
    outputs:
      short_commit_id : ${{ steps.set_short_sha.outputs.short_sha }}
  
  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install yq
        shell: bash
        run: |
          YQ_VERSION=v4.47.2
          curl -sSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /tmp/yq
          sudo install -m 555 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Modify Helm values
        shell: bash
        run: |
          short_commit_id="${{ needs.ci.outputs.short_commit_id }}"
          yq -i ".image.tag = \"${short_commit_id}\"" charts/python-app/values.yaml
          echo "Updated image:"
          yq '.image.tag' charts/python-app/values.yaml
      
      - name: Install Argo CD CLI
        shell: bash
        run: |
          VERSION=v3.5.3
          curl -sSL -o /tmp/argocd "https://github.com/argoproj/argo-cd/releases/download/${VERSION}/argocd-linux-amd64"
          chmod +x /tmp/argocd
          sudo install -m 555 /tmp/argocd /usr/local/bin/argocd
          argocd version --client

      - name: argocd app sync
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} 
          argocd app sync python-app --timeout 60